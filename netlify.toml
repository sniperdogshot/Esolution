# O bot e a documentação ficam no mesmo repositório, mas não fazem parte do site.
[[redirects]]
  from = "/whatsapp-bot/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PRODUCT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
